name: Скриншоты экранов

# Рисует экраны с тестовыми данными (Robolectric + Roborazzi) и выкладывает PNG
# в служебный пререлиз ci-screenshots — по ним проверяется внешний вид без телефона.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          # Без длинной таблицы кеша в журнале: так ошибки сборки видны в его конце.
          add-job-summary: never

      - name: Нарисовать экраны
        run: ./gradlew --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 -Pscreenshots testDebugUnitTest 2>&1 | tee gradle.log

      - name: Отчёт тестов
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Ошибки сборки — в служебный пререлиз
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "workflow: $GITHUB_WORKFLOW"
            echo
            grep -E "^(e|w): |FAILED|What went wrong|Caused by|> Could not|error:" gradle.log | head -150 || true
            echo
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for f in list(case.findall("failure")) + list(case.findall("error")):
                      print("ТЕСТ", case.get("classname"), case.get("name"))
                      print((f.get("message") or "")[:500])
                      print((f.text or "")[:1500])
                      print("---")
          PY
          } > "screenshots-errors.txt" 2>&1
          TAG=ci-screenshots
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Служебное: скриншоты экранов" \
              --notes "Служебные файлы сборки. Устанавливать отсюда нечего — APK лежат в обычных релизах."
          fi
          gh release upload "$TAG" "screenshots-errors.txt" --clobber

      - name: Выложить в пререлиз ci-screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ci-screenshots
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Служебное: скриншоты экранов" \
              --notes "Скриншоты экранов, нарисованные при сборке для проверки внешнего вида. Устанавливать отсюда нечего — APK лежат в обычных релизах."
          fi
          echo "$GITHUB_SHA" > commit.txt
          gh release upload "$TAG" app/build/outputs/roborazzi/*.png commit.txt --clobber
