name: Сборка

# На каждый push — сборка и тесты.
# Релиз с APK создаётся, когда в CHANGELOG.md появляется новая версия (верхний раздел «## X.Y.Z»),
# для которой ещё нет тега: сборка сама ставит тег vX.Y.Z на этот коммит и публикует релиз.
# Тег v*, поставленный вручную, тоже даёт релиз.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Рабочая ветка — не main, поэтому кеш Gradle разрешено записывать с любой ветки.
          cache-read-only: false

      - name: Версия и нужен ли релиз
        id: version
        run: |
          TOP=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4- || true)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$TOP" ] && \
               ! git ls-remote --exit-code --tags origin "refs/tags/v$TOP" > /dev/null 2>&1; then
            VERSION="$TOP"
            RELEASE=true
          else
            VERSION="${TOP:-0.0.0}-dev.${GITHUB_RUN_NUMBER}"
            RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION, релиз: $RELEASE"

      - name: Конфиг Firebase из секрета
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
          fi
          if [ -f app/google-services.json ]; then
            echo "Firebase настроен: синхронизация будет включена."
          else
            echo "::notice::Firebase не настроен — в приложении синхронизация будет показана как «не настроена»."
          fi

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Подпись постоянным ключом."
          else
            echo "::warning::Секреты подписи не заданы — APK подписан отладочным ключом. Такую версию нельзя будет обновить поверх постоянной."
          fi

      - name: Тесты и сборка APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --stacktrace -PappVersion=${{ steps.version.outputs.version }} testDebugUnitTest assembleRelease

      - name: Отчёт тестов
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Переименовать APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/steamgarage-${{ steps.version.outputs.version }}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: steamgarage-${{ steps.version.outputs.version }}
          path: dist/*.apk

      - name: GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Релиз v$VERSION уже есть — пропускаю."
            exit 0
          fi
          # Описание релиза — раздел этой версии из CHANGELOG.md.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Сборка $VERSION" > release-notes.md; fi
          gh release create "v$VERSION" "dist/steamgarage-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Паровой гараж $VERSION" \
            --notes-file release-notes.md
